# Build, migrate and deploy to Cloudflare Pages on every push to main.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the shopshot Pages project
#
# Until both are set the workflow builds only and skips the deploy, so merging
# this file does not deploy anything by itself. Add the secrets after the first
# manual deploy in DEPLOY_CHECKLIST.md has been smoke-tested.
#
# Order matters: migrations run before the deploy, because the new build adds
# the same columns at runtime and SQLite has no ADD COLUMN IF NOT EXISTS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys (or two migrations) at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built only, nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:prod

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # dist/ is already built above; --branch main targets the production
        # deployment (the Pages project's production branch must be "main").
        run: npx wrangler pages deploy dist --project-name shopshot --branch main --commit-dirty=true

      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sleep 20
          curl -fsS https://www.shopshot.co.uk/api/health | tee health.json
          grep -q "\"status\":\"ok\"" health.json
